    Anonymous/public-token for Storefront GraphQL reads; OIDC authorization-code
    + PKCE for customer-scoped access; agent-profile identity (UCP-Agent) for
    the MCP commerce endpoint.
  artifact: authentication/lemon-perfect-authentication.yml
  scopes: scopes/lemon-perfect-scopes.yml
idempotency:
  supported: true
  surfaces:
  - surface: ucp-mcp
    header: Idempotency-Key
    param: 'meta.idempotency-key'
    format: uuid
    description: >-
      "Unique key for retry safety. Maps to HTTP Idempotency-Key header." —
      the `meta` schema of the UCP shopping service the store advertises at
      /.well-known/ucp.
    schema: https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json
    scope: per-request
  - surface: graphql
    evidence: >-
      The 2026-07 Storefront schema defines
      UserErrorsShopPayPaymentRequestSessionUserErrorsCode.IDEMPOTENCY_KEY_ALREADY_USED,
      confirming server-side idempotency-key enforcement on Shop Pay payment
      request sessions.
    schema: graphql/lemon-perfect-storefront-2026-07.graphql
  retention: not published
pagination:
  style: relay-cursor-connections
  surface: graphql
  request_params: [first, last, after, before, reverse, sortKey]
