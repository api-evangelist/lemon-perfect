aid: lemon-perfect
name: Lemon Perfect
description: >-
  Lemon Perfect is an Atlanta-based beverage company founded in 2017 by Yanni
  Hufnagel, making organic, zero-sugar flavored lemon water powered by half a
  squeezed organic lemon per bottle and 100% daily value vitamin C. It sells
  direct-to-consumer at lemonperfect.com alongside national retail distribution.
  It is not a software vendor and publishes no developer program, yet its
  storefront exposes a substantial machine-readable surface on its own apex
  domain: a Storefront GraphQL API with open introspection, a hosted Model
  Context Protocol endpoint implementing the Universal Commerce Protocol for
  agent-driven search, cart and checkout, OpenID Connect and RFC 8414 discovery
  for customer accounts, and first-party agent instructions at /agents.md and
  /llms.txt that set an explicit human-approval-before-payment policy.
