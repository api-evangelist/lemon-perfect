x-enrichment-notes:
  no_status_page: >-
    Lemon Perfect operates no status page for its API surface
    (status.lemonperfect.com does not resolve; /status is 404). No StatusPage
    pointer is emitted.
  no_deprecation_policy: >-
    Deprecation is signalled inside the GraphQL schema via @deprecated (54
    fields) but no deprecation policy document is published. No Deprecation
    pointer.
  no_security_disclosure: >-
    /.well-known/security.txt returns 404 and no responsible-disclosure or bug
    bounty page was found. No Security/VulnerabilityDisclosure pointer.
  no_compliance_program: >-
    No trust center and no named certifications published. No Compliance or
    TrustCenter pointer.
  no_openapi: >-
    No OpenAPI/Swagger document exists on lemonperfect.com or the canonical
    the-lemon-perfect-company.myshopify.com host. The machine-readable contracts
    are GraphQL (introspected verbatim) and the UCP/MCP OpenRPC schema.
  no_sdks: >-
    No first-party Lemon Perfect client library exists in any public registry.
    No Packages/SDKs pointer.
  no_a2a: >-
    Both /.well-known/agent-card.json and /.well-known/agent.json returned 404.
    Nothing was written to a2a/ — agent cards are never authored on a
    provider's behalf.
  platform_note: >-
    The API surface is Shopify-provided but served from, and configured for, the
    company's own apex domain. Platform-level facts are attributed as such inside
    each artifact rather than claimed as first-party commitments.

